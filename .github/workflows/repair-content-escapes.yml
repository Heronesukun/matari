name: Repair content escapes

on:
  push:
    branches: [main]
    paths:
      - scripts/repair-content-escapes.mjs
      - .github/workflows/repair-content-escapes.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore escaped LaTeX commands
        run: node scripts/repair-content-escapes.mjs
      - name: Validate repaired content
        run: node scripts/check-content.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repairs needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/docs
          git commit -m "fix: restore escaped LaTeX commands"
          git push origin HEAD:main
